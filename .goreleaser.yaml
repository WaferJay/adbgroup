version: 2

project_name: adbgroup

builds:
  - id: adbgroup
    main: ./cmd/adbgroup
    binary: adbgroup
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.zh-CN.md
      - config.example.yaml
      - tunnel.example.yaml
      - deploy/adbgroup.service
      - docker/70-android-adb.rules

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  prerelease: auto
  mode: keep-existing

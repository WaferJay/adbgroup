# Install as ~/.config/adbgroup/tunnel.yaml.
# adbgroup t submits this tunnel to the per-user daemon and returns when ready.
# Use different listen ports for multiple tunnels; adbgroup t list/stop manages them.
# Use adbgroup t --no-daemon to run in the foreground.
server: https://adb-host.example:8443
group: team-a

# Optional. When omitted, client.pem, client.key and ca.pem are read from the
# directory containing tunnel.yaml. Relative paths are resolved from there.
# credentials: credentials/alice

# Bare ports bind to 127.0.0.1; full numeric loopback addresses also work.
# listen: 15037

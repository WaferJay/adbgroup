name: adbgroup

services:
  adbgroup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: "${ADBGROUP_IMAGE:-adbgroup:local}"
    restart: unless-stopped
    ports:
      - "${ADBGROUP_PORT:-8443}:8443"
      - "127.0.0.1:${ADBGROUP_ADB_PORT:-5039}:5038"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /etc/adbgroup/config.yaml
        read_only: true
      - type: bind
        source: ./data
        target: /var/lib/adbgroup
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    # Install 70-android-adb.rules on the host to grant plugdev access to
    # new ADB devices. Set USB_GID to that group's actual numeric GID; adding
    # the group alone does not grant read/write access to USB device nodes.
    group_add:
      - "${USB_GID:-46}"
    device_cgroup_rules:
      - "c 189:* rmw"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    stop_grace_period: 30s
